<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Absolute Cinema Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Absolute Cinema Mode</h1>

  <label class="row">
    <span>Enabled</span>
    <input type="checkbox" id="enabled">
  </label>

  <label class="row">
    <span>Auto-enable Cinema mode</span>
    <input type="checkbox" id="autoTheater">
  </label>

  <label class="row">
    <span>Auto-hide top bar</span>
    <input type="checkbox" id="autoHideMasthead">
  </label>

  <label class="row">
    <span>Twitch mode</span>
    <input type="checkbox" id="twitchMode">
  </label>
  <p class="hint">Livestreams and replays: chat stays pinned to the side, in Cinema mode and out of it.</p>

  <label class="row">
    <span>Chat view</span>
    <select id="chatMode">
      <option value="default">YouTube default</option>
      <option value="top">Top chat</option>
      <option value="live">Live chat</option>
    </select>
  </label>

  <label class="row">
    <span>Chat width</span>
    <span class="number">
      <input type="number" id="chatWidth" step="10">
      <span class="unit">px</span>
    </span>
  </label>
  <p class="hint" id="chatWidthHint"></p>

  <footer>
    <span id="version"></span>
    <a href="#" id="changelog">What's new</a>
  </footer>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
